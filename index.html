<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بنك الأسئلة</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="بنك الأسئلة" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- شاشة اختيار المستوى -->
    <div class="card" id="screen-start">
      <h1 class="title">بنك الأسئلة</h1>
      <p class="subtitle">اكتب اسمك، اختر مستوى الصعوبة، وابدأ الاختبار</p>

      <label class="field-label" for="player-name">الاسم</label>
      <input type="text" id="player-name" class="name-input" placeholder="اكتب اسمك هنا" maxlength="40" />
      <p class="field-error hidden" id="name-error">اكتب اسمك قبل ما تبدأ</p>

      <div class="levels">
        <button class="level-btn easy" data-level="easy">
          <span><span class="dot"></span> سهل</span>
          <span class="meta">10 أسئلة · 10 نقاط لكل سؤال</span>
        </button>
        <button class="level-btn medium" data-level="medium">
          <span><span class="dot"></span> متوسط</span>
          <span class="meta">10 أسئلة · 20 نقطة لكل سؤال</span>
        </button>
        <button class="level-btn hard" data-level="hard">
          <span><span class="dot"></span> صعب</span>
          <span class="meta">10 أسئلة · 30 نقطة لكل سؤال</span>
        </button>
      </div>

      <button class="secondary-btn" id="show-log-btn">عرض سجل النتائج</button>
    </div>

    <!-- شاشة سجل النتائج -->
    <div class="card hidden" id="screen-log">
      <div class="log-header">
        <h1 class="title">سجل النتائج</h1>
        <button class="icon-btn" id="clear-log-btn" title="مسح السجل">مسح الكل</button>
      </div>
      <p class="subtitle" id="log-empty">لا توجد نتائج محفوظة بعد. أكمل اختبارًا وبيظهر هنا.</p>
      <div class="log-table-wrap">
        <table class="log-table" id="log-table">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>المستوى</th>
              <th>النتيجة</th>
              <th>النسبة</th>
              <th>التاريخ</th>
            </tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
      <button class="secondary-btn" id="log-back-btn">رجوع</button>
    </div>

    <!-- شاشة الأسئلة -->
    <div class="card hidden" id="screen-quiz">
      <div class="quiz-header">
        <span class="badge" id="quiz-badge"></span>
        <span class="progress-text" id="quiz-progress"></span>
        <span class="score-text" id="quiz-score"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <button class="next-btn" id="next-btn" disabled>التالي</button>
    </div>

    <!-- شاشة النتيجة -->
    <div class="card hidden" id="screen-result">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">أحسنت!</div>
      <div class="result-score" id="result-score">0</div>
      <div class="result-sub" id="result-sub"></div>
      <button class="primary-btn" id="retry-btn">إعادة نفس المستوى</button>
      <button class="secondary-btn" id="home-btn">اختيار مستوى آخر</button>
      <button class="secondary-btn" id="result-log-btn">عرض سجل النتائج</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
